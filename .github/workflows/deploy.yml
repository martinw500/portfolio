name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single job since we're deploying a static site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Only these files are public. Notes, LaTeX source and tooling stay in the repo.
      - name: Stage site
        run: |
          mkdir -p _site/docs
          cp -R index.html styles.css script.js assets CNAME favicon* apple-touch-icon.png _site/
          cp docs/resume.pdf docs/pfp.jpg _site/docs/
          rm -f _site/assets/projects/README.md

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
